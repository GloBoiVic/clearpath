name: Native foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: swift test --package-path native --scratch-path artifacts/native-build
      - run: python scripts/build_native.py --configuration debug --output artifacts/ci-inspection
      # Never install profiles, use real signing identities or activate providers in CI.
